name: helicarrier-seo-guide
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: guide
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: helicarrier_guide
    ports:
      - "127.0.0.1:15439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guide -d helicarrier_guide"]
      interval: 2s
      timeout: 3s
      retries: 20
